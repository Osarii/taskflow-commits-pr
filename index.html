<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Aplicación web para organizar tareas personales."
  >

  <title>TaskFlow | Gestor de tareas</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <main class="app">

    <header class="app__header">
      <div>
        <p class="eyebrow">Gestor de tareas</p>

        <h1>TaskFlow</h1>

        <p class="subtitle">
          Organiza tus tareas de manera rápida y sencilla.
        </p>
      </div>

      <button
        id="themeToggle"
        class="button button--secondary"
        type="button"
      >
        Modo oscuro
      </button>
    </header>

    <section class="panel">
      <h2>Nueva tarea</h2>

      <form id="taskForm" class="task-form">
        <label for="taskInput">
          Descripción de la tarea
        </label>

        <div class="task-form__controls">
          <input
            id="taskInput"
            name="task"
            type="text"
            maxlength="120"
            placeholder="Ejemplo: terminar el laboratorio de Git"
            autocomplete="off"
          >

          <button
            class="button button--primary"
            type="submit"
          >
            Agregar
          </button>
        </div>
      </form>

      <p id="formError" class="form-error"></p>
    </section>

    <section class="panel controls">
      <div class="filters">
        <button
          class="filter-button is-active"
          type="button"
          data-filter="all"
        >
          Todas
        </button>

        <button
          class="filter-button"
          type="button"
          data-filter="pending"
        >
          Pendientes
        </button>

        <button
          class="filter-button"
          type="button"
          data-filter="completed"
        >
          Completadas
        </button>
      </div>

      <button
        id="clearCompleted"
        class="button button--danger"
        type="button"
      >
        Limpiar completadas
      </button>
    </section>

    <section class="panel">
      <div class="list-heading">
        <h2>Mis tareas</h2>

        <p id="taskStats" class="stats">
          0 tareas
        </p>
      </div>

      <p id="emptyState" class="empty-state">
        No hay tareas para mostrar.
      </p>

      <ul id="taskList" class="task-list"></ul>
    </section>

    <footer class="footer">
      <p>TaskFlow · Laboratorio de Git e IA</p>
    </footer>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
